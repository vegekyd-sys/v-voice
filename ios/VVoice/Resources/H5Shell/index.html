<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' blob:; font-src 'self' data:; frame-src 'none'; base-uri 'self'; form-action 'none'">
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f3f9" />
    <title>和 V 通话</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/v-voice-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/v-voice-icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/v-voice-apple-touch.png" />
    <link rel="stylesheet" href="./styles.css" />
  <style>.reader-layer{padding-top:max(24px,env(safe-area-inset-top))}@media(max-width:600px){.reader-layer{padding-top:max(8px,env(safe-area-inset-top))}}</style></head>
  <body
    data-voice-state="idle"
    data-avatar-state="idle"
    data-call-state="idle"
    data-reading="false"
  >
    <!-- The React UI (ui-bundle.mjs) replaces this first frame on start. -->
    <div id="app">
      <main class="call-page" data-call="idle" style="--avatar-size: min(72vw, 40dvh, 300px)">
        <header class="topbar"></header>
        <section class="stage" aria-label="V">
          <div class="avatar">
            <div class="avatar-face"><div class="portrait"><img width="1024" height="1024" decoding="async" fetchpriority="high" src="./assets/v-operator-home-1024.webp" alt="V" /></div></div>
          </div>
          <div class="home"><span class="avatar-name">V</span></div>
        </section>
      </main>
    </div>
    <audio id="remoteAudio" autoplay playsinline></audio
    ><audio id="callSound" preload="none" playsinline></audio>
    <section
      id="contentReader"
      class="reader-layer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="readerTitle"
      hidden
    >
      <div id="readerBackdrop" class="reader-backdrop"></div>
      <div id="readerMorph" class="reader-morph" hidden></div>
      <article id="readerSurface" class="reader-surface">
        <header class="reader-header">
          <button id="readerBack" type="button" aria-label="收起内容">
            ← 收起</button
          ><span id="readerTitle"></span
          ><a id="readerDownload" download>↓ 保存</a>
        </header>
        <div id="readerBody" class="reader-body markdown-body"></div>
      </article>
      <div id="readerDock" class="reader-dock"></div>
    </section>
    <dialog id="changelogDialog" class="changelog-dialog" aria-labelledby="changelogTitle">
      <header class="changelog-header">
        <div><span class="changelog-eyebrow">V VOICE</span><h2 id="changelogTitle">更新日志</h2></div>
        <button id="changelogClose" type="button" aria-label="关闭更新日志" autofocus><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
      </header>
      <div id="changelogEntries" class="changelog-entries" tabindex="0" aria-label="已上线的更新"></div>
    </dialog>
    <script src="./native-h5.js"></script>
  </body>
</html>

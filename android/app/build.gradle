plugins { id 'com.android.application' }
android {
    namespace 'com.versa.vvoice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.versa.vvoice'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SERVICE_URL', '"https://openclaw.tianyi.live/voice/"'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.candidate'
            versionNameSuffix '-candidate'
            def endpoint = providers.gradleProperty('voiceServiceUrl').orElse('https://openclaw.tianyi.live/voice/').get()
            if (!(endpoint ==~ /https?:\/\/[A-Za-z0-9.:-]+\/voice\//)) throw new GradleException('Invalid candidate endpoint')
            buildConfigField 'String', 'SERVICE_URL', '"' + endpoint + '"'
        }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.13.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

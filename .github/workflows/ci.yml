name: Voice
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:speaker-native
      - run: python3 -m unittest discover -s tests -p "release_fleet_test.py"
      - name: Verify production package with fleet safety rules
        run: |
          npm run package -- "$RUNNER_TEMP/voice-artifact"
          node scripts/verify-package.mjs "$RUNNER_TEMP/voice-artifact"
          python3 -c "import os,runpy; runpy.run_path('scripts/release-fleet.py')['verify_artifact'](os.environ['RUNNER_TEMP']+'/voice-artifact')"

  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
        working-directory: android/tv

name: Android Candidate
on:
  push:
    paths: ['android/**', 'lab/gpt-live-h5/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'lab/gpt-live-h5/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node --test android/tests/*.test.mjs
      - run: ./android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VVoice-Android-Candidate
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
